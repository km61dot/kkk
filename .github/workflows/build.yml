name: build-ios

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: 'sing-box tag (empty = latest stable v1.11.x)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 80
    env:
      HAS_SIGNING: ${{ secrets.P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # First run: sources were uploaded as ProxyClient.zip (the phone browser cannot upload folders).
      - name: Unpack ProxyClient.zip into the repository
        run: |
          if [ -f ProxyClient.zip ]; then
            unzip -q -o ProxyClient.zip -x '.github/*' '__MACOSX/*'
            rm -f ProxyClient.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project sources" || true
            git push || echo "push skipped"
          fi
          ls -la

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve sing-box ref
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.sing_box_ref }}
        run: |
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs https://github.com/SagerNet/sing-box 'v1.11.*' | awk '{print $2}' | sed 's#refs/tags/##' | grep -v -- '-' | sort -V | tail -n1)
          fi
          echo "Using sing-box $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Cache Libbox
        id: cache
        uses: actions/cache@v4
        with:
          path: Frameworks/Libbox.xcframework
          key: libbox-${{ steps.ref.outputs.ref }}-ios-v1

      - name: Build Libbox from source
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" https://github.com/SagerNet/sing-box.git _sb
          cd _sb
          export PATH="$PATH:$(go env GOPATH)/bin"
          grep -n 'with_clash_api' cmd/internal/build_libbox/main.go || echo "WARNING: with_clash_api not found in build_libbox"
          make lib_install || true
          go run ./cmd/internal/build_libbox -target apple -platform ios || go run ./cmd/internal/build_libbox -target apple
          cd ..
          mkdir -p Frameworks
          rm -rf Frameworks/Libbox.xcframework
          mv _sb/Libbox.xcframework Frameworks/
          rm -rf _sb

      - name: Dump Libbox headers (for fixing LibboxBridge.swift)
        run: |
          mkdir -p diag
          find Frameworks/Libbox.xcframework -name '*.h' | head -20
          H=$(find Frameworks/Libbox.xcframework -name 'Libbox.objc.h' | head -n1)
          if [ -n "$H" ]; then
            cp "$H" diag/Libbox.objc.h
            echo "---- PlatformInterface protocol ----"
            grep -n -A60 '@protocol LibboxPlatformInterface' "$H" | head -140 || true
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen ldid
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ProxyClient.xcodeproj -scheme ProxyClient -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          echo "==== compiler errors ===="
          grep -E "error:" build.log | sort -u | head -80 || true
          tail -n 3 build.log
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name 'ProxyClient.app' -type d | head -n1)
          echo "APP=$APP"
          ls "$APP" "$APP/PlugIns"
          mkdir -p unsigned && rm -rf unsigned/ProxyClient.app && cp -R "$APP" unsigned/ProxyClient.app
          ldid -SConfig/App.entitlements "$APP/ProxyClient"
          ldid -SConfig/Tunnel.entitlements "$APP/PlugIns/PacketTunnel.appex/PacketTunnel"
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ProxyClient-unsigned.ipa Payload
          ls -la ProxyClient-unsigned.ipa

      # Optional: signed IPA when the paid-account secrets exist
      # (P12_BASE64, P12_PASSWORD, PROFILE_APP_BASE64, PROFILE_TUNNEL_BASE64)
      - name: Sign IPA with your certificate (optional)
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_TUNNEL_BASE64: ${{ secrets.PROFILE_TUNNEL_BASE64 }}
        run: |
          set -eo pipefail
          KC="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -o '"[^"]*"' | head -n1 | tr -d '"')
          echo "identity: $IDENTITY"
          echo "$PROFILE_APP_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_TUNNEL_BASE64" | base64 --decode > "$RUNNER_TEMP/tunnel.mobileprovision"
          APP=unsigned/ProxyClient.app
          sign_bundle() {
            cp "$2" "$1/embedded.mobileprovision"
            security cms -D -i "$2" > "$RUNNER_TEMP/p.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/p.plist" > "$RUNNER_TEMP/ent.plist"
            codesign -f -s "$IDENTITY" --entitlements "$RUNNER_TEMP/ent.plist" "$1"
          }
          sign_bundle "$APP/PlugIns/PacketTunnel.appex" "$RUNNER_TEMP/tunnel.mobileprovision"
          sign_bundle "$APP" "$RUNNER_TEMP/app.mobileprovision"
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ProxyClient-signed.ipa Payload
          ls -la ProxyClient-signed.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: |
            build.log
            diag/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyClient-ipa
          path: |
            ProxyClient-unsigned.ipa
            ProxyClient-signed.ipa
          if-no-files-found: ignore
