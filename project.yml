name: ProxyClient
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
targets:
  ProxyClient:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PacketTunnel
        embed: true
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Smart Proxy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        AppGroupID: group.com.custom.proxyclient
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.custom.proxyclient]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.proxyclient
        PRODUCT_NAME: ProxyClient
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    dependencies:
      - framework: Frameworks/Libbox.xcframework
        embed: false
        link: true
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
    info:
      path: Config/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: Smart Proxy Tunnel
        AppGroupID: group.com.custom.proxyclient
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Config/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [group.com.custom.proxyclient]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.proxyclient.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: YES
schemes:
  ProxyClient:
    build:
      targets:
        ProxyClient: all
    run:
      config: Release
    archive:
      config: Release
